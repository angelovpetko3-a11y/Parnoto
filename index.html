<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔥 Моето парно</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#101827;color:#fff}.container{max-width:650px;margin:auto}h1{text-align:center}.card{background:#1e293b;padding:22px;border-radius:16px;margin:15px 0}.label{color:#cbd5e1;font-size:18px}.value{font-size:38px;font-weight:bold;margin-top:12px}.bar{height:18px;background:#334155;border-radius:20px;overflow:hidden;margin-top:15px}.fill{height:100%;width:0;background:#22c55e;transition:width .4s}.water{background:#38bdf8}input[type=range]{width:100%;margin:22px 0}input[type=email],input[type=password]{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0;font-size:16px}button{background:#f97316;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.status{color:#fbbf24;text-align:center;margin:15px 0;overflow-wrap:anywhere}.small{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="container">
<h1>🔥 Моето парно</h1>
<div id="status" class="status">Свързване с Firebase...</div>
<div id="loginBox" class="card">
<h2>🔐 Вход</h2>
<form id="loginForm">
<input id="email" type="email" autocomplete="username" placeholder="Firebase имейл" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Парола" required>
<button id="loginBtn" type="submit">Вход</button>
</form>
</div>
<div id="dashboard" class="hidden">
<div class="card"><div class="label">🌡️ Температура на водата</div><div id="temperature" class="value">-- °C</div></div>
<div class="card"><div class="label">🌾 Ниво на пелетите</div><div id="pellets" class="value">-- %</div><div class="bar"><div id="pelletsBar" class="fill"></div></div></div>
<div class="card"><div class="label">💧 Ниво на водата в хидрофора</div><div id="hydrofor" class="value">-- %</div><div class="bar"><div id="hydroforBar" class="fill water"></div></div></div>
<div class="card"><div class="label">🎚️ Желана температура</div><div id="targetValue" class="value">-- °C</div><input id="targetSlider" type="range" min="30" max="65" step="1" value="55" disabled><button id="saveTarget" disabled>Запази температурата</button><p class="small">Настройката се записва във Firebase и се получава от NodeMCU.</p></div>
<div class="card"><button id="logoutBtn">Изход</button></div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

// Настройките на твоя Firebase проект. Тук НЕ се записват пароли.
const firebaseConfig={
  apiKey:"AIzaSyCjqK4oplUZqWLd31UWLNuoNosoC1y4lWM",
  authDomain:"moeto-parno.firebaseapp.com",
  databaseURL:"https://moeto-parno-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"moeto-parno",
  storageBucket:"moeto-parno.firebasestorage.app",
  messagingSenderId:"737083575899",
  appId:"1:737083575899:web:3b5d95d08fe29299c8797e"
};
const $=id=>document.getElementById(id);
const status=message=>{$('status').textContent=message;};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
let unsubscribeSensors=null,unsubscribeTarget=null;
let targetFromCloud=false,editingTarget=false;
function showNumber(id,value,unit,decimals=0){const n=Number(value);$(id).textContent=value!==null&&value!==undefined&&value!==''&&Number.isFinite(n)?n.toFixed(decimals)+' '+unit:'-- '+unit;}
function showPercent(id,barId,value){const n=Number(value);const valid=value!==null&&value!==undefined&&value!==''&&Number.isFinite(n);$(id).textContent=valid?Math.round(n)+' %':'-- %';$(barId).style.width=valid?Math.max(0,Math.min(100,n))+'%':'0%';}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{status('Влизане...');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';}catch(error){status('Грешка при вход: '+error.code);}finally{$('loginBtn').disabled=false;}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,user=>{
  if(unsubscribeSensors){unsubscribeSensors();unsubscribeSensors=null;}
  if(unsubscribeTarget){unsubscribeTarget();unsubscribeTarget=null;}
  targetFromCloud=false;editingTarget=false;
  $('targetSlider').disabled=true;$('saveTarget').disabled=true;
  if(!user){$('dashboard').classList.add('hidden');$('loginBox').classList.remove('hidden');status('Въведи Firebase имейл и парола.');return;}
  $('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');status('Свързано с Firebase. Зареждане на данните...');
  unsubscribeSensors=onValue(ref(db,'sensors'),snapshot=>{const data=snapshot.val()||{};showNumber('temperature',data.temperature,'°C',1);showPercent('pellets','pelletsBar',data.pellets);showPercent('hydrofor','hydroforBar',data.hydrofor);status('Свързано с Firebase.');},error=>status('Грешка при четене на датчиците: '+error.message));
  unsubscribeTarget=onValue(ref(db,'settings/target'),snapshot=>{const value=Number(snapshot.val());if(snapshot.exists()&&Number.isFinite(value)&&value>=30&&value<=65){targetFromCloud=true;$('targetSlider').disabled=false;$('saveTarget').disabled=false;if(!editingTarget){$('targetSlider').value=value;$('targetValue').textContent=value+' °C';}}else{targetFromCloud=false;$('targetSlider').disabled=false;$('saveTarget').disabled=false;$('targetValue').textContent=$('targetSlider').value+' °C';}},error=>{status('Грешка при четене на настройката: '+error.message);$('targetSlider').disabled=true;$('saveTarget').disabled=true;});
},error=>status('Грешка при удостоверяване: '+error.message));
$('targetSlider').addEventListener('input',()=>{editingTarget=true;$('targetValue').textContent=$('targetSlider').value+' °C';});
$('saveTarget').addEventListener('click',async()=>{if(!auth.currentUser)return;const target=Number($('targetSlider').value);$('saveTarget').disabled=true;try{await set(ref(db,'settings/target'),target);editingTarget=false;status('Желаната температура е записана: '+target+' °C');}catch(error){status('Грешка при запис: '+error.message);}finally{$('saveTarget').disabled=false;}});
</script>
</body>
</html>
