
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моето парно</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}
h1 { font-size: 30px; }
.subtitle { color: #94a3b8; }
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 22px;
  margin-top: 16px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}
.label { color: #94a3b8; }
.value {
  font-size: 36px;
  font-weight: bold;
  margin-top: 12px;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #475569;
  cursor: not-allowed;
}
input { background: white; color: #111827; }
.status { color: #86efac; margin-top: 15px; }
.warning { color: #fed7aa; }
.error { color: #fca5a5; }
.hidden { display: none; }
@media(max-width:600px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <h1>🔥 Моето парно</h1>
  <p class="subtitle">Дистанционно наблюдение на отоплението</p>

  <section id="loginPanel" class="card">
    <h2>🔐 Вход</h2>
    <input id="email" type="email" placeholder="Имейл">
    <input id="password" type="password" placeholder="Парола">
    <button id="loginButton">Влез</button>
    <p id="loginError" class="error"></p>
  </section>

  <section id="dashboard" class="hidden">
    <p id="status" class="status">Свързване с Firebase...</p>

    <div class="cards">
      <div class="card">
        <div>🌡️ Температура на водата</div>
        <div id="temperature" class="value">-- °C</div>
      </div>
      <div class="card">
        <div>🪵 Ниво на пелетите</div>
        <div id="pellets" class="value">-- %</div>
      </div>
    </div>

    <div class="card">
      <h2>🔥 Парно</h2>
      <button disabled>Включи / изключи — предстои</button>
    </div>

    <div class="card">
      <h2>🔄 Рестарт</h2>
      <button disabled>Рестартирай — предстои</button>
    </div>

    <div class="card warning">
      ⚠️ Релетата още не се управляват от тази страница.
    </div>

    <button id="logoutButton">Изход</button>
  </section>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getDatabase, ref, onValue
} from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

// Firebase конфигурация
const firebaseConfig = {
  apiKey: "AIzaSyCjqK4op1UZqWLd31UWLNuoNosoC1y4lWM",
  authDomain: "moeto-parno.firebaseapp.com",
  databaseURL: "https://moeto-parno-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "moeto-parno",
  storageBucket: "moeto-parno.firebasestorage.app",
  messagingSenderId: "737083575899",
  appId: "1:737083575899:web:3b5d95d08fe29299c8797e"
};

const allowedUid = "lkHeobhIT3MSLi04cRa8AWnM5mW2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const status = document.getElementById("status");
const loginError = document.getElementById("loginError");

let unsubscribe = null;

document.getElementById("loginButton").onclick = async () => {
  loginError.textContent = "";

  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
  } catch (error) {
    loginError.textContent =
      "Неуспешен вход. Провери имейла и паролата.";
  }
};

document.getElementById("logoutButton").onclick = () => {
  signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  if (!user) {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  if (user.uid !== allowedUid) {
    await signOut(auth);
    loginError.textContent = "Този акаунт няма достъп.";
    return;
  }

  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");

  status.textContent = "Свързване с базата...";

  unsubscribe = onValue(
    ref(db, "sensors"),
    (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        status.textContent =
          "Връзката работи. Очакваме данни от ESP8266.";
        return;
      }

      document.getElementById("temperature").textContent =
        typeof data.temperature === "number"
          ? data.temperature.toFixed(1) + " °C"
          : "-- °C";

      document.getElementById("pellets").textContent =
        typeof data.pellets === "number"
          ? data.pellets + " %"
          : "-- %";

      status.textContent = "● Свързано с Firebase";
    },
    (error) => {
      status.textContent = "Грешка при четене на базата.";
      console.error(error);
    }
  );
});
</script>
</body>
</html>
